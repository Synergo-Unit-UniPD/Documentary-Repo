services:
  frontend:
    container_name: frontend_mvp
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      backend:
        condition: service_started

  backend:
    container_name: backend_mvp
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - ZUCCHETTI_LLM_BASE_URL=${ZUCCHETTI_LLM_BASE_URL}
      - ZUCCHETTI_LLM_API_KEY=${ZUCCHETTI_LLM_API_KEY}
      - ZUCCHETTI_LLM_MODEL=${ZUCCHETTI_LLM_MODEL:-gemma4:12b}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
