name: CI Pipeline

on:
  push:
    branches: [ "292-feature_infra_setup-ci-cd" ]
  # pull_request:
  #   branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./poc

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Build dei servizi Docker
        run: docker compose build

      - name: Esegui test Backend (FastAPI)
        env:
          ZUCCHETTI_LLM_API_KEY: ${{ secrets.ZUCCHETTI_LLM_API_KEY }}
        run: docker compose run -e ZUCCHETTI_LLM_API_KEY --rm backend pytest

      - name: Esegui test Frontend (Vue.js)
        run: docker compose run --rm frontend npm run test:unit